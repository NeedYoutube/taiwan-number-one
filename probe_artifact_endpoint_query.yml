name: Probe artifact download endpoint query propagation
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test query propagation into signed artifact downloads
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(s => s.startsWith('Actions.Results:'));
            const [, workflow_run_backend_id, workflow_job_run_backend_id] = scope.split(':');
            const rpcBase = new URL(resultsUrl).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const ids = {workflow_run_backend_id, workflow_job_run_backend_id};
            const rpc = async (method, data) => {
              const response = await fetch(rpcBase + method, {method:'POST', headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'}, body:JSON.stringify(data)});
              return {status:response.status, data:await response.json()};
            };
            const name = 'endpoint-query-' + process.env.GITHUB_RUN_ID;
            const payload = Buffer.from('{"probe":"endpoint-query"}');
            const created = await rpc('CreateArtifact', {...ids, name, version:7, mime_type:'application/json'});
            if (created.status !== 200 || created.data.ok !== true) throw new Error('CreateArtifact failed');
            const uploadUrl = created.data.signed_upload_url || created.data.signedUploadUrl;
            const upload = await fetch(uploadUrl, {method:'PUT', headers:{'x-ms-blob-type':'BlockBlob','x-ms-blob-content-type':'application/json\u0085','x-ms-version':'2023-11-03','Content-Type':'application/octet-stream'}, body:payload});
            if (!upload.ok) throw new Error('Blob upload failed ' + upload.status);
            const hash = 'sha256:' + createHash('sha256').update(payload).digest('hex');
            const finalized = await rpc('FinalizeArtifact', {...ids, name, size:String(payload.length), hash});
            if (finalized.status !== 200 || finalized.data.ok !== true) throw new Error('FinalizeArtifact failed');
            const artifactId = finalized.data.artifact_id || finalized.data.artifactId;
            const base = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/actions/artifacts/' + artifactId + '/zip';
            const variants = [
              ['baseline',''],
              ['rsct_nel','?rsct=application%2Fjson%85'],
              ['rsct_utf8_nel','?rsct=application%2Fjson%C2%85'],
              ['duplicate_rsct','?rsct=application%2Fjson&rsct=application%2Fjson%85'],
              ['response_content_type_nel','?response-content-type=application%2Fjson%85'],
              ['api_version_and_rsct','?api-version=2012-02-12&rsct=application%2Fjson%85'],
            ];
            for (const [label, suffix] of variants) {
              const response = await fetch(base + suffix, {headers:{Authorization:'Bearer ' + process.env.GITHUB_TOKEN, Accept:'application/vnd.github.v3+json'}, redirect:'manual'});
              const location = response.headers.get('location');
              if (!location) { console.log(label + ' status=' + response.status + ' apiType=' + JSON.stringify(response.headers.get('content-type'))); continue; }
              const signed = new URL(location);
              const rsct = signed.searchParams.getAll('rsct').map(v => Buffer.from(v,'utf8').toString('hex')).join(',');
              const final = await fetch(location, {redirect:'manual'});
              const typeHex = Buffer.from(final.headers.get('content-type') || '', 'latin1').toString('hex');
              console.log(label + ' status=' + response.status + ' rsctHex=' + rsct + ' finalStatus=' + final.status + ' typeHex=' + typeHex);
              await final.arrayBuffer();
            }
