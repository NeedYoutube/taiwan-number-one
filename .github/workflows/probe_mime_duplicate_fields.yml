name: Repo Cassette duplicate MIME field probe

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe duplicate ArtifactService MIME fields
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const crypto = require('node:crypto');
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const base = new URL('/twirp/github.actions.results.api.v1.ArtifactService/', resultsUrl);
            const weird = 'application/json\u0085';
            const hex = value => Buffer.from(value, 'latin1').toString('hex');

            function vi(n) {
              const out = [];
              do { let b = n & 0x7f; n >>>= 7; if (n) b |= 0x80; out.push(b); } while (n);
              return Buffer.from(out);
            }
            function bytesField(field, bytes) {
              return Buffer.concat([vi(field * 8 + 2), vi(bytes.length), bytes]);
            }
            function intField(field, n) { return Buffer.concat([vi(field * 8), vi(n)]); }
            const str = s => Buffer.from(s, 'utf8');
            const stringValue = s => bytesField(1, str(s));
            function createRequest(name, mimeParts) {
              return Buffer.concat([
                bytesField(1, str(runId)), bytesField(2, str(jobId)),
                bytesField(3, str(name)), intField(5, 7), ...mimeParts
              ]);
            }
            function readVarint(buf, pos) {
              let value = 0, shift = 0;
              while (pos < buf.length) {
                const b = buf[pos++]; value += (b & 0x7f) * 2 ** shift;
                if (!(b & 0x80)) return [value, pos]; shift += 7;
              }
              throw new Error('truncated varint');
            }
            function createResponse(buf, contentType) {
              if (contentType.includes('json')) {
                const d = JSON.parse(buf.toString('utf8'));
                return {ok: d.ok === true, uploadUrl: d.signed_upload_url || d.signedUploadUrl, reason: d.msg || d.code || ''};
              }
              let p = 0, ok = false, uploadUrl = '';
              while (p < buf.length) {
                let tag; [tag, p] = readVarint(buf, p);
                const field = Math.floor(tag / 8), wire = tag % 8;
                if (wire === 0) { let v; [v, p] = readVarint(buf, p); if (field === 1) ok = v !== 0; }
                else if (wire === 2) { let n; [n, p] = readVarint(buf, p); const b = buf.subarray(p, p + n); p += n; if (field === 2) uploadUrl = b.toString('utf8'); }
                else throw new Error(`unexpected response wire type ${wire}`);
              }
              return {ok, uploadUrl, reason: ''};
            }
            async function rpcJson(method, document) {
              const r = await fetch(new URL(method, base), {
                method: 'POST', headers: {'Authorization': `Bearer ${runtime}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(document)
              });
              return {status: r.status, data: await r.json().catch(() => ({}))};
            }
            async function runCase(label, mode, parts) {
              const name = `mime-dup-${process.env.GITHUB_RUN_ID}-${label}`;
              let status, created;
              if (mode === 'json') {
                const pfx = `"workflow_run_backend_id":${JSON.stringify(runId)},"workflow_job_run_backend_id":${JSON.stringify(jobId)},"name":${JSON.stringify(name)},`;
                const raw = ` {${pfx}${parts}} `;
                const r = await fetch(new URL('CreateArtifact', base), {
                  method: 'POST', headers: {'Authorization': `Bearer ${runtime}`, 'Content-Type': 'application/json'}, body: raw
                });
                status = r.status;
                created = createResponse(Buffer.from(await r.arrayBuffer()), r.headers.get('content-type') || 'application/json');
              } else {
                const r = await fetch(new URL('CreateArtifact', base), {
                  method: 'POST', headers: {'Authorization': `Bearer ${runtime}`, 'Content-Type': 'application/protobuf'},
                  body: createRequest(name, parts)
                });
                status = r.status;
                created = createResponse(Buffer.from(await r.arrayBuffer()), r.headers.get('content-type') || 'application/protobuf');
              }
              const reason = String(created.reason || '').slice(0, 120).replace(/https?:\/\/\S+/g, '[URL]');
              core.info(`CREATE ${label} status=${status} ok=${created.ok} reason=${reason}`);
              if (status !== 200 || !created.ok || !created.uploadUrl) return;

              const placeholder = Buffer.from('{"probe":true}');
              const put = await fetch(created.uploadUrl, {method: 'PUT', headers: {
                'x-ms-blob-type': 'BlockBlob', 'x-ms-blob-content-type': 'application/json',
                'x-ms-version': '2023-11-03', 'Content-Type': 'application/octet-stream'
              }, body: placeholder});
              if (!put.ok) { core.info(`PUT ${label} status=${put.status}`); return; }
              const digest = crypto.createHash('sha256').update(placeholder).digest('hex');
              const finalized = await rpcJson('FinalizeArtifact', {...ids, name, size: String(placeholder.length), hash: `sha256:${digest}`});
              const artifactId = finalized.data.artifact_id || finalized.data.artifactId;
              core.info(`FINAL ${label} status=${finalized.status} ok=${finalized.data.ok === true} artifact=${artifactId || 'none'}`);
              if (finalized.status !== 200 || finalized.data.ok !== true || !artifactId) return;

              const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts/${artifactId}/zip`;
              const redir = await fetch(api, {headers: {
                'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
              }, redirect: 'manual'});
              const location = redir.headers.get('location');
              if (redir.status !== 302 || !location) { core.info(`DOWNLOAD ${label} api_status=${redir.status}`); return; }
              const rsct = new URL(location).searchParams.get('rsct') || '';
              const downloaded = await fetch(location);
              const body = Buffer.from(await downloaded.arrayBuffer());
              const type = downloaded.headers.get('content-type') || '';
              core.info(`DOWNLOAD ${label} status=${downloaded.status} rsct_hex=${hex(rsct)} type_hex=${hex(type)} exact_body=${body.equals(placeholder)}`);
            }

            const j = s => JSON.stringify(s);
            const jsonCases = [
              ['json-valid-weird', 'json', `"mime_type":"application/json","mime_type":${j(weird)},"version":7`],
              ['json-weird-valid', 'json', `"mime_type":${j(weird)},"mime_type":"application/json","version":7`],
              ['json-camel-valid-weird', 'json', `"mimeType":"application/json","mimeType":${j(weird)},"version":7`],
              ['json-camel-weird-valid', 'json', `"mimeType":${j(weird)},"mimeType":"application/json","version":7`],
              ['json-alias-valid-weird', 'json', `"mime_type":"application/json","mimeType":${j(weird)},"version":7`],
              ['json-alias-weird-valid', 'json', `"mime_type":${j(weird)},"mimeType":"application/json","version":7`]
            ];
            for (const [label, mode, parts] of jsonCases) await runCase(label, mode, parts);

            const binaryCases = [
              ['proto-inner-valid-weird', [bytesField(6, Buffer.concat([stringValue('application/json'), stringValue(weird)]))]],
              ['proto-inner-weird-valid', [bytesField(6, Buffer.concat([stringValue(weird), stringValue('application/json')]))]],
              ['proto-outer-valid-weird', [bytesField(6, stringValue('application/json')), bytesField(6, stringValue(weird))]],
              ['proto-outer-weird-valid', [bytesField(6, stringValue(weird)), bytesField(6, stringValue('application/json'))]]
            ];
            for (const [label, parts] of binaryCases) await runCase(label, 'protobuf', parts);
